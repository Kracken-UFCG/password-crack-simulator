services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kracken-backend
    env_file:
      - config.env
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    volumes:
      - ./data:/app/data
      - ./results.csv:/app/results.csv
    
    # IMPORTANT: Uncomment the block below to enable NVIDIA GPU support.
    # Keep these lines commented out if running on a CPU-only machine.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    image: nginx:alpine
    container_name: kracken-frontend
    env_file:
      - config.env
    ports:
      - "${FRONT_PORT:-8081}:80"
    volumes:
      - ./src/front:/usr/share/nginx/html:ro